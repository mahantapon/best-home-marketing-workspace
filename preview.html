function validatePatch(patch){
 if(!patch||typeof patch!=='object'||Array.isArray(patch))throw new Error('รูปแบบรายการแก้ไขไม่ถูกต้อง');
 const clean={};const allowed=new Set(['status','group','rank','owner','due','notes','focus']);
 for(const [key,value]of Object.entries(patch)){
  if(!allowed.has(key))throw new Error('มีช่องข้อมูลที่ไม่รองรับ');

  if(key==='focus'&&typeof value!=='boolean')throw new Error('ข้อมูลโฟกัสไม่ถูกต้อง');
  if(['owner','notes','due'].includes(key)&&typeof value!=='string')throw new Error('ช่องข้อความไม่ถูกต้อง');

  if(key==='notes'&&value.length>5000)throw new Error('บันทึกยาวเกิน 5,000 ตัวอักษร');

   if(!/^\d{4}-\d{2}-\d{2}$/.test(value)||Number.isNaN(Date.parse(value+'T12:00:00Z'))||new Date(value+'T12:00:00Z').toISOString().slice(0,10)!==value)throw new Error('วันที่ไม่ถูกต้อง');
  }
  clean[key]=key==='owner'?value.trim():value;
 }
 return clean;
}

function applyOverrides(tasks,overrides){return tasks.map(t=>({...t,...(Object.hasOwn(overrides,t.id)?overrides[t.id]:{})}));}
function matchesOwner(task,owner){const text=task.owner.toLowerCase();if(owner==='kao')return text.includes('เก้า');if(owner==='junior')return text.includes('น้อง');if(owner==='external')return /outsource|ผู้ดูแล|ผู้พัฒนา/.test(text);if(owner==='support')return /admin|ขาย|operations|บัญชี|pm|site/.test(text);return true;}
function queryTasks(tasks,{query='',group='all',owner='all',status='all',sort='priority',focus=false}={}){
 const q=query.trim().toLocaleLowerCase('th');
 return tasks.filter(t=>(group==='all'||t.group===group)&&(status==='all'||t.status===status)&&matchesOwner(t,owner)&&(!focus||(t.focus&&t.status!=='done'&&t.status!=='paused'))&&(!q||[t.id,t.title,t.owner,t.outcome,t.reason,t.notes].join(' ').toLocaleLowerCase('th').includes(q))).sort((a,b)=>{
  if(sort==='due'){const due=(a.due||'9999').localeCompare(b.due||'9999');if(due)return due;}
  return GROUPS[a.group].order-GROUPS[b.group].order||a.rank-b.rank||a.id.localeCompare(b.id,undefined,{numeric:true});
 });
}
function categoryCounts(tasks){return Object.fromEntries(Object.keys(GROUPS).map(g=>[g,tasks.filter(t=>t.group===g).length]));}
function parseBackup(text,tasks){const data=JSON.parse(text);if(data.app!==BACKUP_APP||data.schemaVersion!==1)throw new Error('ไฟล์นี้ไม่ใช่ข้อมูลสำรองของ Marketing Workspace เวอร์ชันนี้');return validateOverrides(data.overrides,tasks);}
function makeBackup(overrides){return {app:BACKUP_APP,schemaVersion:1,exportedAt:new Date().toISOString(),overrides};}
function toCSV(tasks){
 const cell=v=>{let s=String(v??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"';};
 const rows=[['รหัส','กลุ่ม','ลำดับในกลุ่ม','งาน','ผู้รับผิดชอบ','สถานะ','กำหนดส่ง','ผลลัพธ์','เงื่อนไข','บันทึก'],...tasks.map(t=>[t.id,t.group,t.rank,t.title,t.owner,STATUSES[t.status],t.due,t.outcome,t.reason,t.notes])];
 return '\uFEFF'+rows.map(r=>r.map(cell).join(',')).join('\r\n');
}

 area.innerHTML=`<div class="result-summary"><span>${label} ${resetLink()}</span><div class="view-toggle" aria-label="ลำดับการแสดง"><button data-sort="priority" class="${filters.sort==='priority'?'active':''}">ความสำคัญ</button><button data-sort="due" class="${filters.sort==='due'?'active':''}">กำหนดส่ง</button></div></div>${found.length?`<div class="table-panel"><div class="table-scroll"><table class="task-table"><thead><tr><th scope="col"><span aria-label="โฟกัส">${icon('star')}</span></th><th scope="col">งาน</th><th scope="col">กลุ่ม</th><th scope="col">ผู้รับผิดชอบ</th><th scope="col">สถานะ</th><th scope="col">กำหนดส่ง</th><th scope="col"><span class="sr-only">รายละเอียด</span></th></tr></thead><tbody>${visible.map(t=>`<tr><td>${star(t)}</td><td class="task-cell"><button class="table-title" data-open="${t.id}">${esc(t.title)}</button><span class="table-sub">${t.id} · ลำดับ ${t.rank} ในกลุ่ม ${t.group}</span></td><td>${pill(t.group)}</td><td>${esc(ownerShort(t))}</td><td>${statusTag(t)}</td><td>${due(t)}</td><td><button class="icon-button" data-open="${t.id}" aria-label="เปิดงาน ${t.id}">${icon('chevron')}</button></td></tr>`).join('')}</tbody></table></div><div class="table-footer"><span>หน้า ${page} / ${totalPages} · ${found.length} รายการ</span><div class="table-page-buttons"><button class="icon-button" data-page="prev" aria-label="หน้าก่อนหน้า" ${page===1?'disabled':''}>←</button><button class="icon-button" data-page="next" aria-label="หน้าถัดไป" ${page===totalPages?'disabled':''}>→</button></div></div></div>`:empty()}<p class="subtle-note">ลำดับความสำคัญในมุมมองนี้คือ A → C → B → D เพื่อรักษาเวลาให้งานสำคัญ กำหนดส่งที่ยังไม่ยืนยันเว้นว่างไว้</p>`;
 }}
function renderTeam(){const roles=[{kind:'lead',initial:'ก',avatar:'kao',tag:'DIRECTION & OWNERSHIP',title:'เก้า',description:'นำทีมในช่วงเปลี่ยนผ่าน กำหนดสิ่งที่ต้องทำ และทำให้ทีมรู้ว่าอะไรคือผลงานที่ดี',items:['เป้าหมาย แผน และงบ','วิเคราะห์ผลและตัดสินใจ','Brief ตรวจงาน และโค้ช','ประสาน outsource']},{kind:'',initial:'น',avatar:'junior',tag:'CREATIVE & PRODUCTION',title:'กราฟิกและวิดีโอ',description:'เริ่มจากงานที่มีตัวอย่างชัดเจน ฝึกกับงานจริง และเพิ่มความรับผิดชอบตามทักษะ',items:['ภาพตาม Template','คัดภาพและจัดไฟล์','คลิปพื้นฐานและซับ','ตรวจงานก่อนส่ง']},{kind:'',initial:'E',avatar:'external',tag:'STRATEGY PARTNER',title:'Head Marketing',description:'เก็บ insight และร่วมวางกลยุทธ์ โดยมีเก้าช่วยเชื่อมข้อมูลกับการลงมือของทีม',items:['วิเคราะห์ insight','ร่วมวางทิศทาง','เสนอการทดลอง','Review ผลตามนัด']}];
 const weeks=[['01','พื้นฐานที่ใช้ร่วมกัน','แบรนด์ Layout ฟอนต์ และการจัดไฟล์ ฝึกภาพตาม Template ให้ผ่านก่อนเพิ่มจำนวน'],['02','คลิปแรกที่ผ่านเกณฑ์','ตัดต่อ จังหวะ เสียง และซับ ตรวจ rough cut ก่อนเก็บรายละเอียด'],['03','ชุดสื่อจาก Brief เดียว','ทำภาพกับคลิป 1 ชุด ตรวจแนวคิด ร่าง และความพร้อมก่อนปล่อย'],['04','รับผิดชอบได้มากขึ้น','ทำงานซ้ำที่ผ่านเกณฑ์ได้เอง ดูคุณภาพ ส่งตรงเวลา รอบแก้ และเวลาที่เก้าช่วย']];
 main.innerHTML=heading('ทีมเล็ก ที่เติบโตไปด้วยกัน','บทบาทชัดเจน มีพื้นที่เรียนรู้ และส่งต่องานได้อย่างมั่นใจ','PEOPLE MAKE THE PROGRESS')+`<section class="team-grid">${roles.map(r=>`<article class="team-card ${r.kind}"><span class="avatar avatar-${r.avatar}">${r.initial}</span><p class="team-role">${r.tag}</p><h2>${r.title}</h2><p>${r.description}</p><ul class="role-items">${r.items.map(s=>`<li>${icon('check')}${s}</li>`).join('')}</ul></article>`).join('')}</section><section class="panel"><div class="panel-header"><div><h2>แผนพัฒนา 4 สัปดาห์</h2><p>ข้อเสนอเริ่มต้น ปรับจากคุณภาพงานและเวลาที่ใช้จริง</p></div>${icon('sprout')}</div><div class="roadmap-grid">${weeks.map(w=>`<article class="week-block"><div class="week-no"><span class="tiny-dot"></span>WEEK ${w[0]}</div><h3>${w[1]}</h3><p>${w[2]}</p></article>`).join('')}</div><div class="principle-bar">ตรวจแนวคิดก่อนลงรายละเอียด · ให้ Feedback ที่แก้ได้ · ใช้ Checklist ก่อนส่งงาน</div></section><section class="support-card"><span class="avatar avatar-admin">+</span><div><h3>งานขาย นัดหมาย และระบบภายใน</h3><p>ส่งต่อให้ผู้รับผิดชอบขาย / Admin / Operations ที่บริษัทกำหนด โดยเก้าคุมจุดเชื่อมกับ Marketing</p></div></section>`;
}
function renderHistory(){main.innerHTML=heading('งานที่ผ่านมา ยังมีคุณค่า','เก็บประวัติและระบบเดิมไว้ดูต่อ โดยไม่เปลี่ยนทุกเรื่องให้กลายเป็นงานค้างใหม่','THE WORK BEHIND US')+`<div class="toolbar"><label class="search-wrap">${icon('search')}<input class="search-input" id="history-search" type="search" placeholder="ค้นหางานที่ผ่านมา..." aria-label="ค้นหางานที่ผ่านมา"></label><span class="filter-count">${initialData.history.length} รายการย้อนหลัง</span></div><div class="history-list" id="history-results"></div>`;updateHistory('');}
function updateHistory(q){const found=initialData.history.filter(h=>[h.title,h.status,h.next].join(' ').toLowerCase().includes(q.toLowerCase().trim()));document.querySelector('#history-results').innerHTML=found.length?found.map(h=>`<article class="history-card"><div class="history-meta"><span>${h.id}</span><span>${esc(h.period)}</span></div><h3>${esc(h.title)}</h3><p>${esc(h.status)}</p><details><summary>แนวทางดูแลต่อ ${icon('down')}</summary><p>${esc(h.next)}</p><p>เกี่ยวข้องกับ ${esc(h.related)}<br>ที่มา: ${esc(h.source)}</p></details></article>`).join(''):empty();}
function render(){renderNav();({overview:renderOverview,focus:renderFocus,board:renderBoard,tasks:renderTasks,team:renderTeam,history:renderHistory}[view])();document.title=`${viewNames[view]} — best home Marketing`;}
function setView(next){if(!Object.hasOwn(viewNames,next))return;if(view===next){render();return;}location.hash=next;}
function closeMenu(){document.querySelector('#sidebar').classList.remove('is-open');document.querySelector('#sidebar-overlay').hidden=true;document.querySelector('#mobile-menu').setAttribute('aria-expanded','false');}
window.addEventListener('hashchange',()=>{view=Object.hasOwn(viewNames,location.hash.slice(1))?location.hash.slice(1):'overview';page=1;closeMenu();render();window.scrollTo({top:0,behavior:'instant'});});
function openTask(id){const t=tasks.find(x=>x.id===id);if(!t)return;const dialog=document.querySelector('#task-dialog');dialog.innerHTML=`<form id="task-form" data-id="${t.id}"><div class="dialog-header"><div class="dialog-topline">${pill(t.group)}<span class="task-id">รหัสอ้างอิง ${t.id}</span><button type="button" class="star-button ${t.focus?'is-focus':''}" id="dialog-focus" aria-label="ปักงานโฟกัส" aria-pressed="${t.focus}">${icon('star')}</button><button type="button" class="icon-button" data-close="task-dialog" aria-label="ปิดรายละเอียด">${icon('close')}</button></div><h2 class="dialog-title" id="dialog-title">${esc(t.title)}</h2></div><div class="dialog-body"><div class="outcome-box"><span class="detail-label">ผลลัพธ์ที่ต้องได้</span><p>${esc(t.outcome)}</p></div><div class="edit-grid"><div class="edit-field"><label for="edit-status">สถานะงาน</label><select id="edit-status" name="status">${options(STATUSES,t.status)}</select></div><div class="edit-field"><label for="edit-due">กำหนดส่งจริง</label><input id="edit-due" type="date" name="due" value="${esc(t.due)}"></div><div class="edit-field"><label for="edit-group">กลุ่มความสำคัญ</label><select id="edit-group" name="group">${options(Object.fromEntries(Object.entries(GROUPS).map(([g,m])=>[g,g+' · '+m.title])),t.group)}</select></div><div class="edit-field"><label for="edit-rank">ลำดับในกลุ่ม</label><input id="edit-rank" name="rank" type="number" min="1" max="999" required value="${t.rank}"></div><div class="edit-field wide"><label for="edit-owner">ผู้รับผิดชอบ</label><input id="edit-owner" name="owner" required maxlength="150" value="${esc(t.owner)}"></div><div class="edit-field wide"><label for="edit-notes">บันทึกเพิ่มเติม</label><textarea id="edit-notes" name="notes" maxlength="5000" placeholder="สิ่งที่ต้องทำต่อ ข้อมูลที่รอ หรือ Feedback...">${esc(t.notes)}</textarea></div></div><div class="detail-context"><span class="detail-label">เหตุผลและเงื่อนไข</span><p>${esc(t.reason)}</p><details><summary>ดูจังหวะทำและที่มาของรายการ</summary><p>จังหวะทำที่เสนอ: ${esc(t.timing)}<br>ที่มา: ${esc(t.source)}</p></details></div><p class="import-feedback" id="form-error" role="alert"></p></div><div class="dialog-footer"><small>บันทึกในเบราว์เซอร์นี้<br>ยังไม่ซิงก์กับเครื่องอื่น</small><div class="dialog-actions"><button type="button" class="button button-outline" data-close="task-dialog">ยกเลิก</button><button type="submit" class="button">บันทึกการเปลี่ยนแปลง ${icon('check')}</button></div></div></form>`;
 dialog.showModal();
 document.querySelector('#dialog-focus').addEventListener('click',e=>{const el=e.currentTarget;const focused=el.getAttribute('aria-pressed')!=='true';el.setAttribute('aria-pressed',String(focused));el.classList.toggle('is-focus',focused);});
 document.querySelector('#task-form').addEventListener('submit',event=>{event.preventDefault();const fd=new FormData(event.currentTarget);try{const ok=savePatch(id,{status:fd.get('status'),group:fd.get('group'),rank:Number(fd.get('rank')),owner:fd.get('owner'),due:fd.get('due'),notes:fd.get('notes'),focus:document.querySelector('#dialog-focus').getAttribute('aria-pressed')==='true'});dialog.close();render();showToast(ok?'บันทึกการเปลี่ยนแปลงแล้ว':'ยังบันทึกลงเครื่องไม่ได้ กรุณาส่งออกข้อมูลสำรอง');}catch(error){document.querySelector('#form-error').textContent=error.message;}});
}
function download(filename,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function openExport(){const dialog=document.querySelector('#export-dialog');dialog.innerHTML=`<div class="modal-heading"><h2 id="export-title">นำงานไปใช้ต่อ</h2><button class="icon-button" data-close="export-dialog" aria-label="ปิดส่งออก">${icon('close')}</button></div><p>เลือกตารางสำหรับเปิดใน Excel หรือสำรองการแก้ไขเพื่อย้ายไปใช้ในเบราว์เซอร์อื่น</p><div class="export-options"><button class="export-choice" data-export="csv">${icon('file')}<span><strong>ส่งออกตาราง CSV</strong><small>งาน ${tasks.length} รายการ พร้อมสถานะและกำหนดส่งล่าสุด</small></span></button><button class="export-choice" data-export="json">${icon('box')}<span><strong>สำรองการแก้ไขเป็น JSON</strong><small>เก็บสถานะ ผู้รับผิดชอบ วันส่ง และงานโฟกัส</small></span></button></div><label class="import-label" for="backup-import">นำเข้าข้อมูลสำรอง (รวมทับเฉพาะงานที่มีในไฟล์)<input id="backup-import" type="file" accept="application/json,.json"></label><p id="import-feedback" class="import-feedback" role="alert"></p>`;dialog.showModal();document.querySelector('#backup-import').addEventListener('change',async event=>{const file=event.target.files[0];if(!file)return;const feedback=document.querySelector('#import-feedback');try{if(file.size>2_000_000)throw new Error('ไฟล์ใหญ่เกิน 2 MB');const incoming=parseBackup(await file.text(),initialData.tasks);const updated={...overrides,...incoming};localStorage.setItem(STORE_KEY,JSON.stringify(updated));overrides=updated;tasks=applyOverrides(initialData.tasks,overrides);storageOK=true;updateStorageLabel();dialog.close();render();showToast(`นำเข้าการแก้ไข ${Object.keys(incoming).length} รายการแล้ว`);}catch(error){feedback.textContent='นำเข้าไม่ได้: '+error.message;event.target.value='';}});}
document.addEventListener('click',event=>{const el=event.target.closest('button, a');if(!el)return;
 if(el.dataset.view){setView(el.dataset.view);return;}
 if(el.dataset.groupView){filters={...filters,query:'',group:el.dataset.groupView,owner:'all',status:'all'};setView('board');return;}
 if(el.dataset.open){openTask(el.dataset.open);return;}
 if(el.dataset.star){const t=tasks.find(x=>x.id===el.dataset.star);const ok=savePatch(t.id,{focus:!t.focus});if(view==='overview'||view==='focus')render();else updateResults();showToast(ok?(t.focus?'นำออกจากงานโฟกัสแล้ว':'เพิ่มเป็นงานโฟกัสแล้ว'):'การเปลี่ยนแปลงยังไม่บันทึกลงเครื่อง');return;}
 if(el.dataset.close){document.getElementById(el.dataset.close).close();return;}
 if(el.dataset.action==='reset-filters'){filters={query:'',group:'all',owner:'all',status:'all',sort:'priority'};page=1;render();return;}
 if(el.dataset.sort){filters.sort=el.dataset.sort;page=1;updateResults();return;}
 if(el.dataset.page){page+=el.dataset.page==='next'?1:-1;updateResults();document.querySelector('#results-area')?.scrollIntoView({block:'start',behavior:'smooth'});return;}
 if(el.dataset.export){const stamp=new Date().toISOString().slice(0,10);if(el.dataset.export==='csv')download(`best-home-marketing-${stamp}.csv`,toCSV(queryTasks(tasks)), 'text/csv;charset=utf-8');else download(`best-home-marketing-backup-${stamp}.json`,JSON.stringify(makeBackup(overrides),null,2),'application/json');showToast('เตรียมไฟล์ดาวน์โหลดแล้ว');return;}
});
document.addEventListener('input',event=>{if(event.target.id==='task-search'){filters.query=event.target.value;page=1;updateResults();}if(event.target.id==='history-search')updateHistory(event.target.value);});
document.addEventListener('change',event=>{const map={'group-filter':'group','owner-filter':'owner','status-filter':'status'};if(map[event.target.id]){filters[map[event.target.id]]=event.target.value;page=1;updateResults();}});
document.addEventListener('keydown',event=>{if(event.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)&&!document.querySelector('dialog[open]')){const search=document.querySelector('.search-input');if(search){event.preventDefault();search.focus();}}});
for(const dialog of document.querySelectorAll('dialog'))dialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dialog.close();}});
document.querySelector('#export-button').innerHTML=icon('download')+'ส่งออกข้อมูล';document.querySelector('#export-button').addEventListener('click',openExport);
document.querySelector('#print-button').innerHTML=icon('print');document.querySelector('#print-button').addEventListener('click',()=>window.print());
document.querySelector('#mobile-menu').innerHTML=icon('menu');document.querySelector('#mobile-menu').addEventListener('click',()=>{const side=document.querySelector('#sidebar'),open=!side.classList.contains('is-open');side.classList.toggle('is-open',open);document.querySelector('#sidebar-overlay').hidden=!open;document.querySelector('#mobile-menu').setAttribute('aria-expanded',String(open));});
document.querySelector('#sidebar-overlay').addEventListener('click',closeMenu);
window.addEventListener('beforeprint',()=>{printMode=true;if(view==='tasks')updateResults();});window.addEventListener('afterprint',()=>{printMode=false;if(view==='tasks')updateResults();});
updateStorageLabel();render();if(!storageOK)showToast(storageMessage);

})();</script>
